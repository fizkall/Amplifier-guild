<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sayfa bulunamadı · Kıvılcım Zirvesi'26</title>
  <meta name="description" content="Aradığın sayfa bulunamadı. Kıvılcım Zirvesi'26 ana sayfasına dön." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100svh;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 0%,#4246c6,#2f319f 48%,#22237a);color:#fff1dc;font-family:"Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden;padding:24px;text-align:center}
    .b{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:-1}
    .b1{width:60vmin;height:60vmin;background:radial-gradient(circle at 50% 42%,#ffbf5e,#ff5a1f 62%,#e2410f);top:50%;left:50%;transform:translate(-50%,-50%);filter:none;opacity:1}
    .b2{display:none}
    h1{font-family:Archivo,Impact,sans-serif;font-stretch:125%;font-weight:900;font-size:clamp(6rem,25vw,14rem);line-height:1;background:linear-gradient(180deg,#fff1dc,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
    h2{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:900;color:#fff1dc;text-shadow:3px 3px 0 #16174d;text-transform:uppercase;font-size:clamp(1.6rem,5vw,2.6rem);margin-top:8px}
    p{opacity:.75;margin:14px auto 0;max-width:30rem}
    a{display:inline-block;margin-top:32px;padding:16px 28px;border-radius:16px;font-weight:800;color:#fff1dc;text-decoration:none;background:#16174d;box-shadow:4px 4px 0 #fff1dc}
    img{width:88px;height:88px;border-radius:50%;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="b b1" aria-hidden="true"></div><div class="b b2" aria-hidden="true"></div>
  <main>
    <img src="/logo.png" alt="Kıvılcım Zirvesi'26 logosu" width="88" height="88" />
    <h1>404</h1>
    <h2>Bu kıvılcım sönmüş!</h2>
    <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ama zirve hâlâ seni bekliyor.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
