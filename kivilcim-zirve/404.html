<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sayfa bulunamadı · Kıvılcım Zirvesi'26</title>
  <meta name="description" content="Aradığın sayfa bulunamadı. Kıvılcım Zirvesi'26 ana sayfasına dön." />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0}
    body{min-height:100svh;display:grid;place-items:center;background:#0b0612;color:#fdf0d5;font-family:"Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden;padding:24px;text-align:center}
    .b{position:fixed;border-radius:50%;filter:blur(80px);opacity:.4;z-index:-1}
    .b1{width:50vmax;height:50vmax;background:#ff6a2b;top:-20vmax;right:-15vmax}
    .b2{width:40vmax;height:40vmax;background:#14b8c6;bottom:-18vmax;left:-15vmax}
    h1{font-family:Oswald,Impact,sans-serif;font-size:clamp(6rem,25vw,14rem);line-height:1;background:linear-gradient(100deg,#fdf0d5,#ff6a2b 50%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
    h2{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:clamp(1.6rem,5vw,2.6rem);margin-top:8px}
    p{opacity:.75;margin:14px auto 0;max-width:30rem}
    a{display:inline-block;margin-top:32px;padding:16px 28px;border-radius:16px;font-weight:800;color:#0b0612;text-decoration:none;background:linear-gradient(120deg,#ff6a2b,#ff8a4c)}
    img{width:88px;height:88px;border-radius:50%;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="b b1" aria-hidden="true"></div><div class="b b2" aria-hidden="true"></div>
  <main>
    <img src="/logo.png" alt="Kıvılcım Zirvesi'26 logosu" width="88" height="88" />
    <h1>404</h1>
    <h2>Bu kıvılcım sönmüş!</h2>
    <p>Aradığın sayfa taşınmış ya da hiç var olmamış olabilir. Ama zirve hâlâ seni bekliyor.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
